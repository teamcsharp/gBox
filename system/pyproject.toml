[project]
name = "gbox"
version = "0.1.0"
description = "G-Box universal game laboratory: control plane, workers, catalog, adapters, UAP"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gbox = "gbox.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
