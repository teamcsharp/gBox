[project]
name = "gbox"
version = "0.1.0"
description = "gBox universal game laboratory: control plane, workers, catalog, adapters, UAP"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "httpx>=0.27", "capstone>=5.0", "yt-dlp>=2026.1", "numpy>=1.26", "pillow>=10", "jsonschema>=4.23", "PyYAML>=6.0", "tzdata>=2024.1; sys_platform == 'win32'", "zstandard>=0.25; python_version < '3.14'"]

[project.optional-dependencies]
test = ["pytest>=8", "psutil>=5.9"]
browser = ["psutil>=5.9", "playwright>=1.40"] # isolated UI evidence / browser diagnostics
mcp = ["mcp>=2.3"]                # gbox mcp: Claude Desktop / Claude Code / other agents
overlay = ["opencv-contrib-python-headless>=4.8"]   # PC venv: overlay swap tracker (clients/desktop/overlay_track.py, CSRT)

[project.scripts]
gbox = "gbox.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gbox", "gbox.doa2_native_export", "gbox.vendor", "gbox.vendor.universal_modder"]

[tool.setuptools.package-data]
gbox = ["rea_catalog.json.gz", "REA-LICENSE", "native/*.c"]
"gbox.doa2_native_export" = ["tools/*.java", "REPRODUCE.md"]
"gbox.vendor.universal_modder" = ["LICENSE", "knowledge_index.json", "blender/*.py", "playbooks/*.md", "playbooks/engines/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
