<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PSO placement editor</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.4 ui-monospace, monospace; background: #101418; color: #d8d8d8; }
  header { padding: 10px 14px; background: #161c22; border-bottom: 1px solid #232b33; display: flex; gap: 12px; align-items: center; }
  h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
  main { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 48px); }
  aside { border-right: 1px solid #232b33; overflow: auto; }
  section { overflow: auto; padding: 10px; }
  select, input, button { background: #1b2229; color: inherit; border: 1px solid #2b3540; border-radius: 4px; padding: 4px 6px; font: inherit; }
  button { cursor: pointer; } button:hover { background: #243039; }
  .row { display: flex; gap: 6px; align-items: center; padding: 2px 0; }
  .set { padding: 5px 10px; border-bottom: 1px solid #1b2127; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .set:hover { background: #1b2229; } .set.active { background: #243039; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid #1b2127; white-space: nowrap; }
  th { color: #8fa3b5; font-weight: 500; position: sticky; top: 0; background: #101418; }
  .fam { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  #svg { background: #0b0e11; border: 1px solid #232b33; max-width: 100%; }
  #msg { color: #8fa3b5; }
</style>
</head>
<body>
<header>
  <h1>PSO placement editor</h1>
  <span id="msg">loading sets...</span>
  <span style="flex:1"></span>
  <label>family <input id="family" size="8" placeholder="door,warp"></label>
  <button id="reload">reload set</button>
</header>
<main>
  <aside id="sets"></aside>
  <section>
    <div id="preview"></div>
    <div class="row" style="margin:10px 0 6px">
      <input id="index" size="4" placeholder="idx">
      <input id="x" size="7" placeholder="x">
      <input id="y" size="7" placeholder="y">
      <input id="z" size="7" placeholder="z">
      <button id="preview-btn">preview move</button>
      <input id="mod-name" size="18" placeholder="mod name (build)">
      <button id="build-btn">build mod</button>
      <span style="margin-left:12px">swap fit</span>
      <input id="fit-host" size="2" value="A">
      <span>&rarr;</span>
      <input id="fit-donor" size="2" value="C">
      <button id="fit-btn">check</button>
    </div>
    <table><thead><tr><th>#</th><th>class</th><th>family</th><th>kind</th><th>x</th><th>y</th><th>z</th><th>world</th></tr></thead>
    <tbody id="records"></tbody></table>
  </section>
</main>
<script>
const FAMILY_COLOURS = {door:"#e8b13a", warp:"#3ac7e8", switch:"#7ce83a", trap:"#e85b3a", sensor:"#c03ae8",
  sign:"#b9b9b9", prop:"#8a8a8a", decor:"#e83a9c", effects:"#3a6ce8", collision:"#4a4a4a", object:"#d8d8d8", unknown:"#000"};
let current = null, sets = [];

async function api(path, opts) {
  const res = await fetch(path, Object.assign({headers: {"content-type": "application/json"}}, opts));
  if (!res.ok) throw new Error((await res.text()) || res.status);
  return res;
}
function msg(text) { document.getElementById("msg").textContent = text; }

async function loadSets() {
  const data = await (await api("/api/pso/editor/sets")).json();
  sets = data.sets;
  const box = document.getElementById("sets");
  box.innerHTML = "";
  for (const s of sets) {
    const row = document.createElement("div");
    row.className = "set"; row.title = s.name; row.textContent = s.name + "  (" + s.kind + (s.where === "archive" ? ", archive" : "") + ")";
    row.onclick = () => selectSet(s.name);
    box.appendChild(row);
  }
  msg(sets.length + " editable sets");
  if (sets.length) selectSet(sets[0].name);
}

async function selectSet(name) {
  current = name;
  document.querySelectorAll(".set").forEach(el => el.classList.toggle("active", el.title === name));
  msg("loading " + name + "...");
  const data = await (await api("/api/pso/editor/set/" + encodeURIComponent(name))).json();
  const fam = document.getElementById("family").value.trim();
  const svgRes = await api("/api/pso/editor/set/" + encodeURIComponent(name) + "/svg?width=760" + (fam ? "&families=" + encodeURIComponent(fam) : ""));
  document.getElementById("preview").innerHTML = await svgRes.text();
  const body = document.getElementById("records");
  body.innerHTML = "";
  for (const r of data.records) {
    const tr = document.createElement("tr");
    const colour = FAMILY_COLOURS[r.family] || "#d8d8d8";
    tr.innerHTML = `<td>${r.index}</td><td>${r.class}</td><td><span class="fam" style="background:${colour}"></span>${r.family}</td>` +
      `<td>${r.kind.toString(16)}</td><td>${r.x}</td><td>${r.y}</td><td>${r.z}</td>` +
      `<td>${r.world ? r.world[0] + ", " + r.world[1] : ""}</td>`;
    body.appendChild(tr);
  }
  msg(name + ": " + data.count + " placements - " + JSON.stringify(data.families));
}

document.getElementById("reload").onclick = () => current && selectSet(current);
document.getElementById("preview-btn").onclick = async () => {
  if (!current) return;
  const idx = document.getElementById("index").value;
  const op = {op: "move", set: current, index: Number(idx),
              x: Number(document.getElementById("x").value), y: Number(document.getElementById("y").value),
              z: Number(document.getElementById("z").value)};
  try {
    const data = await (await api("/api/pso/editor/preview", {method: "POST", body: JSON.stringify({ops: [op]})})).json();
    msg("preview: " + data.files + " file(s), " + data.edits + " edit(s) - no image built");
  } catch (err) { msg("preview refused: " + err.message); }
};
document.getElementById("build-btn").onclick = async () => {
  if (!current) return;
  const name = document.getElementById("mod-name").value.trim().toLowerCase();
  if (!name) { msg("name the mod first (lowercase letters, digits, . _ -)"); return; }
  const idx = document.getElementById("index").value;
  const op = {op: "move", set: current, index: Number(idx),
              x: Number(document.getElementById("x").value), y: Number(document.getElementById("y").value),
              z: Number(document.getElementById("z").value)};
  msg("building " + name + " ... a real disc build takes minutes");
  try {
    const data = await (await api("/api/pso/editor/build", {method: "POST", body: JSON.stringify({name, ops: [op]})})).json();
    const v = data.verification || {};
    msg("built " + data.name + ": " + data.image + " - verification ok=" + v.ok);
  } catch (err) { msg("build failed: " + err.message); }
};
document.getElementById("fit-btn").onclick = async () => {
  const host = document.getElementById("fit-host").value.trim().toUpperCase();
  const donor = document.getElementById("fit-donor").value.trim().toUpperCase();
  try {
    const data = await (await api(`/api/pso/editor/swapfit?host=${host}&donor=${donor}`)).json();
    msg(`swap ${data.donor.class} -> ${data.host.class}: ${data.safe ? (data.deforms ? "SAFE (will deform)" : "SAFE") : "REFUSE"} - ${data.why}`);
  } catch (err) { msg("swap fit failed: " + err.message); }
};
loadSets().catch(err => msg("error: " + err.message));
</script>
</body>
</html>
