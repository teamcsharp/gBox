<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G-Box</title>
<link rel="icon" href="/brand/gbox-logo.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<style>
  :root { --bg:#fff; --fg:#1b1b1f; --mut:#6b6b76; --line:#e3e3e8; --card:#f6f6f8; --acc:#3355dd; --ok:#1a7f37; --bad:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16161a; --fg:#e8e8ee; --mut:#9a9aa6; --line:#2c2c34; --card:#1f1f25; --acc:#7c96ff; --ok:#4cc26b; --bad:#ff6b6b; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:25; }
  header b { font-size:16px; } .brand { display:flex; align-items:center; gap:8px; } .brand img { height:28px; width:auto; } nav button { background:none; border:0; color:var(--mut); padding:6px 8px; cursor:pointer; font:inherit; }
  nav button.on { color:var(--fg); border-bottom:2px solid var(--acc); }
  main { padding:16px; max-width:1400px; margin:0 auto; }
  input,select,button.act { font:inherit; padding:5px 8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:4px; }
  button.act { cursor:pointer; } button.pri { background:var(--acc); color:#fff; border-color:var(--acc); }
  table { border-collapse:collapse; width:100%; } td,th { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:500; } .ok{color:var(--ok)} .bad{color:var(--bad)} .mut{color:var(--mut)} code{font-size:12px}
  .wrap { overflow-x:auto; } .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:6px; overflow:hidden; display:flex; flex-direction:column; }
  .card .art { aspect-ratio:4/3; background:#0003; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .card .art img { width:100%; height:100%; object-fit:contain; } .card .art span { color:var(--mut); font-size:12px; padding:8px; text-align:center; }
  #pip { position:fixed; right:16px; bottom:16px; width:320px; height:240px; min-width:160px; min-height:120px; z-index:10; background:#000;
         border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 30px #0008; overflow:hidden; display:none; cursor:grab;
         user-select:none; touch-action:none; }
  #pip img { width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; }
  #pip .grip { position:absolute; right:0; bottom:0; width:18px; height:18px; cursor:nwse-resize;
               background:linear-gradient(135deg,#0000 50%,#fff8 50%,#fff8 60%,#0000 60%,#0000 70%,#fff8 70%,#fff8 80%,#0000 80%); }
  #pip .bar { position:absolute; top:0; left:0; right:0; display:flex; gap:6px; align-items:center; padding:4px 8px; margin:0;
              background:linear-gradient(#000c,#0000); color:#fff; font-size:12px; }
  #pip .bar span { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #pip button { background:#0008; color:#fff; border:0; border-radius:4px; cursor:pointer; padding:2px 7px; font:inherit; }
  .padrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px; border:1px solid var(--line); border-radius:6px; margin-bottom:10px; }
  .pill { font-size:12px; padding:2px 8px; border-radius:10px; background:var(--card); border:1px solid var(--line); }
  .pill.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .card .meta { padding:8px; flex:1; display:flex; flex-direction:column; gap:4px; }
  .card .t { font-weight:600; line-height:1.25; } .card .s { font-size:12px; color:var(--mut); }
  .card .row { display:flex; gap:6px; margin-top:auto; padding-top:6px; }
  .play { display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:16px; }
  @media (max-width:800px) { .play { grid-template-columns:1fr; } }
  .screen { background:#000; border-radius:6px; width:100%; outline:none; min-height:200px; display:block; }
  .screen:focus { box-shadow:0 0 0 2px var(--acc); }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; user-select:none; }
  .pad button { padding:12px 0; }
  .inspect { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:16px; }
  @media (max-width:1100px) { .inspect { grid-template-columns:1fr; } }
  .panel { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:12px; }
  .panel h4 { margin:0 0 8px; font-size:13px; }
  .hex { font:12px/1.5 ui-monospace,Consolas,monospace; margin:0; overflow-x:auto; white-space:pre; }
  .hex .hb { cursor:pointer; border-radius:2px; } .hex .hb:hover { background:var(--acc); color:#fff; }
  .tiles { image-rendering:pixelated; background:#000; border:1px solid var(--line); cursor:crosshair; touch-action:none; max-width:100%; }
  .tabs2 { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .tabs2 button { border:0; border-radius:0; } .tabs2 button.pri { color:#fff; }

  /* --- loading screen: particle ribbon + pulsing logo + logo-shaped progress + console ticker --- */
  #loader { position:fixed; inset:0; z-index:40; display:none; overflow:hidden;
            background:radial-gradient(ellipse at 50% 55%, #4a2326 0%, #2a1416 45%, #120909 100%); }
  #loader.on { display:block; animation:ldin .35s ease; } @keyframes ldin { from { opacity:0 } }
  #loader.out { opacity:0; transition:opacity .6s; }
  #loader canvas { position:absolute; inset:0; width:100%; height:100%; }
  #loader .logo { position:absolute; left:50%; top:44%; width:min(26vh,220px); aspect-ratio:668/783; transform:translate(-50%,-50%); }
  #loader .logo .ghost { position:absolute; inset:0; background:url(/brand/gbox-logo.svg) center/contain no-repeat; opacity:.16;
                         animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.34; transform:scale(1.04); filter:drop-shadow(0 0 18px #ffd9c840); } }
  #loader .logo .fill { position:absolute; inset:0; -webkit-mask:url(/brand/gbox-logo.svg) center/contain no-repeat;
                        mask:url(/brand/gbox-logo.svg) center/contain no-repeat; }
  #loader .logo .fill i { position:absolute; left:0; right:0; bottom:0; height:0%; transition:height .5s ease;
                          background:linear-gradient(0deg,#ffb38a,#fff3ea); box-shadow:0 0 30px #ffd2b0; }
  #loader .ttl { position:absolute; left:0; right:0; top:calc(44% + min(15vh,128px)); text-align:center; color:#f3e3dc;
                 font-weight:300; letter-spacing:.04em; font-size:22px; text-shadow:0 2px 20px #000; }
  #loader .sub { position:absolute; left:0; right:0; top:calc(44% + min(15vh,128px) + 34px); text-align:center; color:#cdb3aa; font-size:13px; }
  #loader .con { position:absolute; left:0; right:0; bottom:0; height:30px; overflow:hidden; background:#0008; border-top:1px solid #ffffff14;
                 font:12px/30px ui-monospace,Consolas,monospace; color:#e9d3c9; padding:0 14px; }
  #loader .con div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; animation:tick .25s ease; }
  @keyframes tick { from { transform:translateY(100%); opacity:0 } }
  #loader .err { color:#ff8a80; }
  #loader .back { position:absolute; right:14px; bottom:40px; display:none; }
  #loader .ldbtns { position:absolute; left:0; right:0; top:calc(44% + min(15vh,128px) + 64px); display:flex; gap:10px; justify-content:center; }
  #loader .ldbtns button { background:#0006; color:#f3e3dc; border-color:#ffffff30; }
  #gsearch { flex:1; max-width:420px; min-width:160px; margin-left:12px; font:inherit; padding:5px 12px; border-radius:16px;
             border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  #gsearch:focus { outline:none; border-color:var(--acc); }
  .where { display:inline-flex; border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-left:8px; }
  .where button { border:0; background:none; color:var(--mut); padding:4px 12px; cursor:pointer; font:inherit; font-size:12px; }
  .where button.on { background:var(--acc); color:#fff; }

  /* --- console carousel + sort/filter bar --- */
  .carousel { position:relative; margin:0 -4px 12px; }
  .car-track { display:flex; gap:10px; overflow-x:auto; scroll-behavior:smooth; padding:4px 36px 10px; scrollbar-width:thin; }
  .car-item { flex:0 0 150px; height:92px; border:1px solid var(--line); border-radius:10px; background:var(--card); cursor:pointer;
              display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:8px; position:relative;
              transition:transform .12s, border-color .12s; user-select:none; }
  .car-item:hover { transform:translateY(-2px); border-color:var(--acc); }
  .car-item.on { border-color:var(--acc); box-shadow:0 0 0 2px var(--acc) inset; background:color-mix(in srgb, var(--acc) 14%, var(--card)); }
  .car-item img { max-width:130px; max-height:52px; object-fit:contain; }
  .car-item .nm { font-size:12px; font-weight:600; text-align:center; line-height:1.15; }
  .car-item .ct { font-size:11px; color:var(--mut); }
  .car-btn { position:absolute; top:30px; width:30px; height:40px; border:1px solid var(--line); border-radius:8px; background:var(--bg);
             color:var(--fg); cursor:pointer; z-index:2; font-size:16px; }
  .car-btn.l { left:2px; } .car-btn.r { right:2px; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .fchip { border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:14px; padding:3px 10px; cursor:pointer; font:inherit; font-size:12px; }
  .fchip.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .alpha { display:flex; gap:2px; flex-wrap:wrap; margin-bottom:10px; }
  .alpha button { border:0; background:none; color:var(--mut); cursor:pointer; font:12px ui-monospace,monospace; padding:2px 5px; border-radius:4px; }
  .alpha button.on, .alpha button:hover { background:var(--acc); color:#fff; }
  .card { position:relative; } .card .fav { position:absolute; top:6px; right:6px; z-index:1; border:0; background:#0009; color:#ffd166;
          border-radius:50%; width:28px; height:28px; cursor:pointer; font-size:15px; line-height:28px; }

  /* --- A-Z scrubber + single scrollbar --- */
  html { scrollbar-width:thin; } html::-webkit-scrollbar { width:8px; } html::-webkit-scrollbar-thumb { background:#ffffff22; border-radius:4px; }
  #scrub { position:fixed; right:4px; top:110px; bottom:16px; width:22px; z-index:30; display:flex; flex-direction:column; justify-content:space-between;
           align-items:center; user-select:none; touch-action:none; cursor:ns-resize; border-radius:11px; padding:4px 0; }
  #scrub:hover, #scrub.drag { background:#ffffff10; }
  #scrub span { font:600 10px/1 ui-monospace,Consolas,monospace; color:var(--mut); flex:1; display:flex; align-items:center; }
  #scrub span.on { color:var(--acc); transform:scale(1.5); }
  #scrubtip { position:fixed; right:36px; z-index:31; display:none; background:var(--acc); color:#fff; font:700 28px system-ui; width:52px; height:52px;
              border-radius:12px; align-items:center; justify-content:center; box-shadow:0 6px 24px #0008; }
  main { padding-right:34px !important; }

  /* library controls stay pinned under the header while the grid scrolls */
  .libtop { position:sticky; top:var(--hdr, 52px); z-index:20; background:var(--bg); margin:0 -16px; padding:10px 16px 2px;
            border-bottom:1px solid var(--line); box-shadow:0 8px 16px -12px #000c; }
  .car-track { scrollbar-width:none; } .car-track::-webkit-scrollbar { display:none; }
</style>
</head>
<body>
<header>
  <span class="brand"><img src="/brand/gbox-logo.svg" alt=""><b>G-Box</b></span>
  <nav id="tabs"></nav>
  <input id="gsearch" type="search" placeholder="Search games…" aria-label="Search games" autocomplete="off">
  <span class="where" id="where" title="Where games run: natively on this PC (full FPS) or on the DGX Spark (streamed)">
    <button data-w="local">This PC</button><button data-w="spark">Spark</button></span>
  <span style="flex:1"></span>
  <input id="tok" type="password" placeholder="API token" size="22" aria-label="API token">
</header>
<main id="view"></main>
<div id="scrub" aria-label="Jump to letter" style="display:none"></div><div id="scrubtip"></div>
<div id="loader" aria-live="polite">
  <canvas id="ldcv"></canvas>
  <div class="logo"><div class="ghost"></div><div class="fill"><i id="ldbar"></i></div></div>
  <div class="ttl" id="ldtitle"></div><div class="sub" id="ldsub"></div>
  <div class="con" id="ldcon"><div>…</div></div>
  <div class="ldbtns" id="ldbtns"><button class="act" id="ldcancel" title="Esc">Cancel (Esc)</button>
    <button class="act" id="ldlocal" style="display:none">Play on this PC instead</button></div>
  <button class="act back" id="ldback" onclick="loader.hide();show('Library')">Back to library</button>
</div>

<div id="pip" title="Double-click to return to the game · drag to move">
  <img id="pipimg" alt="Game picture-in-picture">
  <div class="bar"><span id="piptitle"></span><button id="pipclose" title="Hide (the game keeps running)">✕</button></div>
  <div class="grip" id="pipgrip" title="Drag to resize"></div>
</div>
<script>
const tabs = { Library: library, Sessions: sessionsView, Controllers: controllersView, Jobs: jobs, Tools: toolsView, Workers: workersView, Audit: audit, Metrics: metrics };
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
let tok = ""; try { tok = localStorage.getItem("gbox_tok") || ""; } catch {}
const tq = () => "token=" + encodeURIComponent(tok);
$("#tok").value = tok;
$("#tok").onchange = e => { tok = e.target.value; try { localStorage.setItem("gbox_tok", tok); } catch {} show(cur); };
async function api(path, body, method) {
  const r = await fetch(path, { method: method || (body ? "POST" : "GET"), headers: { authorization: "Bearer " + tok, "content-type": "application/json" }, body: body && JSON.stringify(body) });
  if (!r.ok) throw new Error(r.status + " " + (await r.text())); return r.json();
}
let cur = "Library", timer = null;
$("#tabs").innerHTML = Object.keys(tabs).map(t => `<button data-t="${t}">${t}</button>`).join("");
$("#tabs").onclick = e => e.target.dataset.t && show(e.target.dataset.t);
async function show(t, ...args) {
  cur = t; const sc = document.getElementById("scrub"); if (sc && t !== "Library") sc.style.display = "none"; clearInterval(timer); document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  playing = t === "Sessions" && args[0] ? args[0] : null;          // the session shown full-size, if any
  pip();                                                         // leaving a game -> picture-in-picture
  try { $("#view").innerHTML = await tabs[t](...args); tabs[t].after && tabs[t].after(...args); }
  catch (e) { $("#view").innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
}


// ---------------- loading screen (three.js particle ribbon, logo-shaped progress bar, console ticker) ----------------
const loader = {
  three: null, raf: 0,
  async scene() {
    if (this.three) return this.three;
    try {
      const THREE = await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js");
      const cv = $("#ldcv"), r = new THREE.WebGLRenderer({ canvas: cv, alpha: true, antialias: true });
      const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(50, 1, 0.1, 100); cam.position.set(0, 0.6, 9);
      const ribbons = [];
      for (const [nx, nz, size, op, yoff, speed] of [[320, 40, 0.035, 0.55, 0, 1], [220, 14, 0.05, 0.35, -0.5, 1.3], [160, 8, 0.02, 0.6, 0.6, 0.8]]) {
        const pos = new Float32Array(nx * nz * 3);
        const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        const m = new THREE.PointsMaterial({ size, color: 0xffe2d6, transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending });
        const pts = new THREE.Points(g, m); scene.add(pts); ribbons.push({ nx, nz, pos, g, yoff, speed, pts });
      }
      const fit = () => { const w = cv.clientWidth, h = cv.clientHeight; r.setSize(w, h, false); r.setPixelRatio(Math.min(devicePixelRatio, 2)); cam.aspect = w / h; cam.updateProjectionMatrix(); };
      addEventListener("resize", fit); fit();
      this.three = { r, scene, cam, ribbons, fit, t0: performance.now() };
    } catch (e) { this.three = { failed: e }; }                 // offline: the logo + bar + console still work
    return this.three;
  },
  frame() {
    const T = this.three; if (!T || T.failed) return;
    const t = (performance.now() - T.t0) / 1000;
    for (const R of T.ribbons) {                                // undulating, swirling ribbon of particles (XMB-style)
      let k = 0;
      for (let i = 0; i < R.nx; i++) for (let j = 0; j < R.nz; j++) {
        const x = (i / (R.nx - 1) - 0.5) * 22, z = (j / (R.nz - 1) - 0.5) * 2.4, tt = t * R.speed;
        const y = Math.sin(x * 0.32 + tt * 0.55) * 0.9 + Math.sin(x * 0.85 - tt * 0.37 + z * 1.7) * 0.32 + Math.sin(z * 2.2 + tt) * 0.12 + R.yoff;
        const tw = Math.sin(x * 0.18 + tt * 0.3) * 0.9;           // ribbon twist
        R.pos[k++] = x; R.pos[k++] = y + z * Math.sin(tw) * 0.5; R.pos[k++] = z * Math.cos(tw);
      }
      R.g.attributes.position.needsUpdate = true;
      R.pts.rotation.x = -0.18 + Math.sin(t * 0.07) * 0.05; R.pts.rotation.z = Math.sin(t * 0.05) * 0.04;
    }
    T.r.render(T.scene, T.cam);
    this.raf = requestAnimationFrame(() => this.frame());
  },
  async show(title, sub) {
    $("#ldtitle").textContent = title || "Loading"; $("#ldsub").textContent = sub || "";
    $("#ldbar").style.height = "0%"; $("#ldcon").innerHTML = "<div>Preparing…</div>"; $("#ldback").style.display = "none";
    const el = $("#loader"); el.classList.remove("out"); el.classList.add("on");
    await this.scene(); this.three.fit && this.three.fit(); cancelAnimationFrame(this.raf); this.frame();
  },
  progress(pct, msg) {
    $("#ldbar").style.height = Math.max(0, Math.min(100, pct)) + "%";
    if (msg && $("#ldcon").firstChild?.textContent !== msg) $("#ldcon").innerHTML = `<div>${esc(msg)}</div>`;
  },
  fail(msg) { $("#ldcon").innerHTML = `<div class="err">${esc(msg)}</div>`; $("#ldback").style.display = "block"; },
  hide() { const el = $("#loader"); el.classList.add("out"); setTimeout(() => { el.classList.remove("on", "out"); cancelAnimationFrame(this.raf); }, 600); },
};

const STT = async buf => { const r = await fetch("/api/stt", { method: "POST", body: buf, headers: { authorization: "Bearer " + tok, "content-type": "audio/webm" } });
  if (!r.ok) throw new Error(await r.text()); return (await r.json()).text; };
const SPARK_OK = async () => { try { return (await fetch("/api/health")).ok; } catch { return false; } };
// ---------------- dictation: 🎤 on every text box, transcribed by the Spark's faster-whisper ----------------
(() => {
  const MIC = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>`;
  const css = document.createElement("style");
  css.textContent = `.micwrap{position:relative;display:inline-flex;align-items:center;min-width:0}
    .micwrap>input,.micwrap>textarea{width:100%;padding-right:30px!important;box-sizing:border-box}
    .micbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut,#999);cursor:pointer;padding:2px;border-radius:50%;line-height:0;z-index:2}
    .micwrap>textarea+.micbtn{top:14px;transform:none}
    .micbtn:hover{color:var(--fg,#eee)} .micbtn.rec{color:#fff;background:#e53935;animation:micp 1s infinite} .micbtn.busy{opacity:.5}
    @keyframes micp{50%{box-shadow:0 0 0 6px #e5393540}}`;
  document.head.append(css);
  let rec = null;
  async function toggle(btn, field) {
    if (rec) { rec.stop(); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { alert("Microphone unavailable: " + e.message); return; }
    const chunks = [], mr = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });
    mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); rec = null; btn.classList.remove("rec"); btn.classList.add("busy");
      try {
        const text = await STT(await new Blob(chunks, { type: "audio/webm" }).arrayBuffer());
        if (text) {
          const s = field.selectionStart ?? field.value.length, e = field.selectionEnd ?? field.value.length;
          const pre = field.value.slice(0, s), sep = pre && !/\s$/.test(pre) ? " " : "";
          field.value = pre + sep + text + field.value.slice(e);
          field.focus(); field.setSelectionRange(pre.length + sep.length + text.length, pre.length + sep.length + text.length);
          field.dispatchEvent(new Event("input", { bubbles: true }));
        }
      } catch (err) { alert("Dictation failed: " + err.message); }
      btn.classList.remove("busy");
    };
    mr.start(); rec = mr; btn.classList.add("rec"); btn.title = "Recording… click to stop";
  }
  const skip = el => el.type === "password" || el.closest(".micwrap") || el.dataset.nomic !== undefined || el.offsetParent === null && el.type === "hidden";
  function decorate(root) {
    root.querySelectorAll?.('input[type="text"], input[type="search"], input:not([type]), textarea').forEach(el => {
      if (skip(el)) return;
      const cs = getComputedStyle(el), w = document.createElement("span");
      w.className = "micwrap";
      w.style.flex = cs.flex; w.style.minWidth = el.style.minWidth || cs.minWidth; w.style.maxWidth = cs.maxWidth;
      if (cs.display === "block" || el.tagName === "TEXTAREA") w.style.display = "flex";
      if (el.style.width) w.style.width = el.style.width;

async function hexRefresh(sid) {

    const ctx = cv.getContext("2d"), img = ctx.createImageData(cv.width, cv.height), pal = gray(ncol);

async function toClipboards(canvas, name, meta) {   // OS clipboard (PNG) + G-Box clipboard (Blender add-on pastes it)

    if (!I.snap) return $("#sres").textContent = "take a snapshot first";
    const now = await readRange(sid, "ram", I.base, I.span), op = v("#sop"), val = parseInt(v("#sval"), 16);
    const test = { eq: (a, b) => b === val, chg: (a, b) => a !== b, same: (a, b) => a === b, inc: (a, b) => b > a, dec: (a, b) => b < a }[op];
    const pool = I.cands || Array.from({ length: I.span }, (_, i) => i);
    I.cands = pool.filter(i => test(I.snap[i], now[i])); I.snap = now;
    $("#sres").innerHTML = `${I.cands.length.toLocaleString()} candidates` + (I.cands.length <= 64 ? ": " + I.cands.map(i =>
      `<a href="#" data-j="${I.base + i}">0x${hex(I.base + i)}=${hex(now[i], 2)}</a>`).join(" ") : " (keep filtering)");
  };
  $("#sres").onclick = e => { const j = e.target.dataset?.j; if (j === undefined) return; e.preventDefault(); I.src = "ram"; $("#msrc").value = "ram"; I.addr = (+j) & ~15; $("#maddr").value = hex(I.addr); hexRefresh(sid); };
  const tre = () => tilesRender(sid), page = () => FMT[I.fmt][1] * I.cols * I.rows;
  $("#tsrc").onchange = () => { I.tsrc = v("#tsrc"); I.sel = null; tre(); };
  $("#toff").onchange = () => { I.toff = parseInt(v("#toff"), 16) || 0; tre(); };
  $("#tprev").onclick = () => { I.toff = Math.max(0, I.toff - page()); $("#toff").value = hex(I.toff); I.sel = null; tre(); };
  $("#tnext").onclick = () => { I.toff += page(); $("#toff").value = hex(I.toff); I.sel = null; tre(); };
  $("#tfmt").onchange = () => { I.fmt = v("#tfmt"); I.sel = null; tre(); };
  $("#tzoom").onchange = () => { I.zoom = Math.max(1, Math.min(8, +v("#tzoom"))); tre(); };
  const cv = $("#tiles"), cell = e => { const r = cv.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / (8 * I.zoom)), Math.floor((e.clientY - r.top) / (8 * I.zoom))]; };
  let d0 = null;
  cv.onpointerdown = e => { d0 = cell(e); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if (!d0) return; const [x, y] = cell(e); I.sel = { x0: Math.min(d0[0], x), y0: Math.min(d0[1], y), x1: Math.max(d0[0], x), y1: Math.max(d0[1], y) }; tre(); };
  cv.onpointerup = () => d0 = null;
  $("#tcopy").onclick = async () => {
    const s = I.sel || { x0: 0, y0: 0, x1: I.cols - 1, y1: I.rows - 1 };
    const out = document.createElement("canvas"); out.width = (s.x1 - s.x0 + 1) * 8; out.height = (s.y1 - s.y0 + 1) * 8;
    out.getContext("2d").drawImage(cv, s.x0 * 8, s.y0 * 8, out.width, out.height, 0, 0, out.width, out.height);
    const first = I.toff + (s.y0 * I.cols + s.x0) * FMT[I.fmt][1];
    $("#tmsg").textContent = await toClipboards(out, `tiles_${I.tsrc}_${hex(first)}`, { session: sid, game: I.info.title, source: I.tsrc, offset: first, format: I.fmt, tiles: s });
  };
  $("#copyframe").onclick = async () => {
    const blob = await (await fetch(`/api/sessions/${encodeURIComponent(sid)}/frame.jpg?${tq()}`)).blob(), bm = await createImageBitmap(blob);
    const c = document.createElement("canvas"); c.width = bm.width; c.height = bm.height; c.getContext("2d").drawImage(bm, 0, 0);
    $("#tmsg").textContent = await toClipboards(c, `frame_${Date.now()}`, { session: sid, game: I.info.title, kind: "frame" });
  };
  hexRefresh(sid); tilesRender(sid);
  timer = setInterval(() => { if (I.auto && cur === "Sessions" && $("#hexv")) hexRefresh(sid); }, 500);
};

// ---------------- Ops views ----------------
async function jobs() {
  const js = await api("/api/jobs");
  timer = setInterval(() => cur === "Jobs" && show("Jobs"), 4000);
  return table(["Job", "Tool", "State", "Worker", "Error / output", "Receipt"], js.map(j => `<tr>
    <td><code>${j.id}</code><br><span class="mut">${new Date(j.created * 1000).toLocaleTimeString()}</span></td><td>${esc(j.tool)}</td><td>${state(j.state)}</td>
    <td><code>${esc(j.worker_id)}</code></td><td><code>${esc(j.error || JSON.stringify(j.output || "").slice(0, 200))}</code></td>
    <td>${j.receipt_id ? `<a href="#" onclick='receipt(${JSON.stringify(j.receipt_id)});return false'>${j.receipt_id}</a>` : ""}</td></tr>`));
}
async function receipt(id) {
  clearInterval(timer);
  const r = await api("/api/receipts/" + id);
  $("#view").innerHTML = `<p><button class="act" onclick="show('Jobs')">Back</button></p><h3>Receipt ${esc(id)}</h3>
    <p>Validation: ${r.validation_ok ? '<span class="ok">passed</span>' : '<span class="bad">failed</span>'} ${esc(r.validation_problems.join("; "))}</p>` +
    table(["Artifact", "Type", "Size", "sha256", ""], r.artifacts.map(a => `<tr><td><a href="/api/artifacts/${a.sha256}?${tq()}" target="_blank">${esc(a.name)}</a></td><td>${esc(a.media_type)}</td><td>${a.size}</td><td><code>${a.sha256}</code></td>
      <td>${/gltf|image\/png/.test(a.media_type) ? `<button class="act" onclick='toBlender(${JSON.stringify(a)}, this)'>→ Blender</button>` : ""}</td></tr>`)) +
    `<pre class="mut" style="white-space:pre-wrap">${esc(JSON.stringify(r, null, 1))}</pre>`;
}
async function toBlender(a, btn) {         // put an existing artifact on the G-Box clipboard; Blender add-on pastes it
  const item = await api("/api/clipboard", { kind: /gltf/.test(a.media_type) ? "gltf" : "image", name: a.name, artifact: a.sha256, meta: a.provenance || {} });
  btn.textContent = `copied #${item.seq} — Ctrl+Shift+V in Blender`;
}
async function toolsView() {
  const ts = await api("/api/tools");
  return table(["Tool", "Permissions", "Available on", "Unavailable", "Validation"], ts.map(t => `<tr>
    <td><b>${esc(t.name)}</b> <span class="mut">v${t.version}</span><br><span class="mut">${esc(t.description)}</span></td>
    <td>${t.permissions.join(", ")} ${t.granted ? "" : '<span class="bad">(not granted)</span>'}</td>
    <td>${t.workers.length ? esc(t.workers.join(", ")) : '<span class="bad">no online worker</span>'}</td>
    <td class="mut">${Object.entries(t.unavailable).map(([w, r]) => esc(w + ": " + r)).join("<br>")}</td><td class="mut">${esc(t.validation)}</td></tr>`));
}
async function workersView() {
  const ws = await api("/api/workers");
  return table(["Worker", "OS", "Status", "Tools", ""], ws.map(w => `<tr><td>${esc(w.name)}<br><code class="mut">${w.id}</code></td><td>${w.os}</td>
    <td>${w.online ? '<span class="ok">online</span>' : '<span class="mut">offline</span>'}</td><td>${esc(w.tools.join(", "))}</td>
    <td>${w.online ? `<button class="act" onclick='provision(${JSON.stringify(w.id)})'>Install / verify deps</button>` : ""}</td></tr>`));
}
async function provision(wid) { await api("/api/jobs", { tool: "provision_node", input: {}, require_worker: wid }); show("Jobs"); }
async function audit() {
  const [v, log] = await Promise.all([api("/api/audit/verify"), api("/api/audit?limit=500")]);
  return `<p>Hash chain: ${v.ok ? `<span class="ok">intact</span> (${v.entries} entries)` : `<span class="bad">BROKEN at seq ${v.first_bad_seq}</span>`}</p>` +
    table(["#", "Time", "Actor", "Action", "Subject", "Data"], log.reverse().map(e => `<tr><td>${e.seq}</td><td>${new Date(e.ts * 1000).toLocaleString()}</td>
      <td>${esc(e.actor)}</td><td>${esc(e.action)}</td><td><code>${esc(e.subject)}</code></td><td><code class="mut">${esc(JSON.stringify(e.data).slice(0, 200))}</code></td></tr>`));
}
async function metrics() {
  const m = await api("/api/metrics");
  return table(["Metric", "Value"], Object.entries(m).map(([k, v]) => `<tr><td>${k}</td><td><code>${esc(typeof v === "object" ? JSON.stringify(v) : v)}</code></td></tr>`));
}
show(cur);
</script>
