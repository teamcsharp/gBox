<body>
<header>
  <span class="brand"><img src="/brand/gbox-logo.svg" alt=""><b>gBox</b></span>
  <nav id="tabs"></nav>
  <input id="gsearch" type="search" placeholder="Search games…" aria-label="Search games" autocomplete="off">
  <span class="where" id="where" title="Where games run: natively on this PC (full FPS) or on the DGX Spark (streamed)">
    <button data-w="local">This PC</button><button data-w="spark">Spark</button></span>
  <span style="flex:1"></span>
  <span id="tray" aria-label="Running sessions and notifications"></span>
  <input id="tok" type="password" placeholder="API token" size="22" aria-label="API token" style="display:none">
</header>
<div id="traypop" role="menu"></div>
<main id="view"></main>
<div id="scrub" aria-label="Jump to letter" style="display:none"></div><div id="scrubtip"></div>
<div id="loader" aria-live="polite">
  <canvas id="ldcv"></canvas>
  <img class="shot" id="ldshot" alt="" onerror="this.style.display='none'">
  <div class="logo"><div class="ghost"></div><div class="fill"><i id="ldbar"></i></div></div>
  <div class="ttl" id="ldtitle"></div><div class="sub" id="ldsub"></div>
  <div class="pbar"><i id="ldpbar"></i><span id="ldpct">0%</span></div>
  <div class="con" id="ldcon"><div>…</div></div>
  <div class="ldbtns" id="ldbtns"><button class="act" id="ldcancel" title="Esc">Cancel (Esc)</button>
    <button class="act" id="ldlocal" style="display:none">Play on this PC instead</button></div>
  <button class="act back" id="ldback" onclick="loader.hide();show('Library')">Back to library</button>
</div>

<div id="pip" title="Double-click to return to the game · drag to move">
  <img id="pipimg" alt="Game picture-in-picture">
  <div class="bar"><span id="piptitle"></span><button id="pipclose" title="Hide (the game keeps running)">✕</button></div>
  <div class="grip" id="pipgrip" title="Drag to resize"></div>
</div>
<script>
const tabs = { Library: library, Mods: modsView, Builds: buildsView, Models: selfieModelsView, Sessions: sessionsView, Controllers: controllersView, Jobs: jobs, Tools: toolsView, Workers: workersView, Audit: audit, Metrics: metrics };
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

// Keep a fixed-position menu inside the window (#1052, #1397): measure it once its content is in, flip it above the pointer
// when it would run past the bottom, clamp it to the edges, and let it scroll inside when it is taller than the window.
// A ResizeObserver re-fits the menu when its content changes later (menus load their entries asynchronously). A shown
// menu is "has client rects": offsetParent is always null for position:fixed, which kept this re-fit from ever running (#1562).
function fitMenu(el, x, y, pad = 8, minTop = pad) {
  if (!el) return;
  el._fitXY = [x, y, pad, minTop];
  if (!el._fitRO && window.ResizeObserver) {
    el._fitRO = new ResizeObserver(() => { if (el._fitXY && el.getClientRects().length) refitMenu(el); });
    el._fitRO.observe(el);
  }
  refitMenu(el);
}

// Any popup can be moved by pressing on a spot that is not a control and dragging (#1415); it stays where it was
// dropped, and a drag never counts as a click. Controls, text fields, the 3D stage and scrollable logs keep their job.
function dragAnywhere(el) {
  if (!el || el._dragAny) return el;
  el._dragAny = true;
  el.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest("button, a, input, select, textarea, label, option, canvas, video, [contenteditable], .pp-log, .scroll")) return;

    const move = ev => {
      const dx = ev.clientX - x0, dy = ev.clientY - y0;

      el.style.top = Math.max(0, Math.min(innerHeight - 24, r.top + dy)) + "px";

// ---------------- model clips: scroll beside the model, played in the viewer ----------------
// 3D: THREE.AnimationMixer on the viewer's model (+ a sibling <slug>.anims.glb loaded on first use), play / pause /
// loop / speed / scrubber (viz/clip-player.js). 2D sprite entries: the clip's APNG / WebP loop in the preview, MP4 link.
function modelClips(model, viewer, fileUrl, preview) {
  const el = $("#model-clips"); if (!el || !window.GBoxClips) return null;
  const rows = GBoxClips.list(model, viewer ? viewer.embedded : []);
  if (!viewer) return GBoxClips.mount(el, rows.filter(r => r.kind === "2d"), { url: fileUrl,
    sprite: row => { if (preview?.isConnected) preview.innerHTML = `<img style="width:100%;height:100%;object-fit:contain;image-rendering:pixelated" src="${fileUrl(row.preview)}" alt="${esc(row.name)}">`;
      GBoxAssetContext.bind(preview, {name:model.name + " · " + row.name, url:fileUrl(row.preview), format:"image", mp4:row.mp4 ? fileUrl(row.mp4) : ""}); } });
  let ui = null;
  const player = GBoxClips.player(viewer.THREE, viewer.holder, st => ui?.render(st));
  viewer.setPlayer(player);
  ui = GBoxClips.mount(el, rows.filter(r => r.kind === "3d"), { url: fileUrl, load: async row => ({ player, clip: await viewer.clip(row) }) });
  return ui;
}

const loader = {
  three: null, raf: 0, generation: 0,
  async scene() {                                             // the 10-mode visualizer (/viz): random per title, right-click to choose
    if (this.three) return this.three;
    try {
      const V = await import("/viz/viz.js");
      const viz = await V.createViz($("#ldcv"), { mode: V.readVizPref(), quality: "auto" });
      V.attachPicker($("#loader"), viz);
      this.three = { V, viz };
    } catch (e) { this.three = { failed: e }; }                 // no WebGL / offline: the logo + bar + console still work
    return this.three;
  },
  frame() {},
  // a modded launch: what it replaces (marquee + slides) and what is on (viz/launch-mods.js); a stock launch shows none
  modsFor(gid, mod) {
    if (!window.GBoxLaunchMods || !gid) return;
    this.mods = this.mods || GBoxLaunchMods.mount($("#loader"), {
      url: u => /^(https?|data|blob):/.test(u) || /[?&]token=/.test(u) ? u : `${u}${u.includes("?") ? "&" : "?"}${tq()}`,
      fetchJson: (p, signal) => fetch(p, { headers: { authorization: "Bearer " + tok }, signal })
        .then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status)))) });
    const keep = modKeepGet(gid);
    this.mods.start({ gameId: gid, mod: mod || "", sessionMods: keep.length
      ? signal => fetch("/api/mods", { headers: { authorization: "Bearer " + tok }, signal })
          .then(r => r.ok ? r.json() : []).then(cards => GBoxLaunchMods.sessionModsFrom(cards, keep)) : null }).catch(() => {});
  },
  show(title, sub, shot) {                                    // shot: a picture of the game (a session being moved: its last frame)
    this.generation++; this.mods?.clear();
    const im = $("#ldshot"); if (im) { im.style.display = shot ? "block" : "none"; if (shot) im.src = shot; }
    const lc = $("#ldcancel"); if (lc?.style) lc.style.display = "";       // a move hides it: the job can't be cancelled midway
    $("#ldtitle").textContent = title || "Loading"; $("#ldsub").textContent = sub || "";
    $("#ldbar").style.height = "0%"; $("#ldpbar").style.width = "2%"; $("#ldpct").textContent = "0%";
    $("#ldcon").innerHTML = "<div>Preparing…</div>"; $("#ldback").style.display = "none";
    const el = $("#loader"); el.classList.remove("out"); el.classList.add("on");
    // The decorative visualizer can wait on GPU initialization. Never hold up the real launch for it.
    this.scene().then(T => {
      if (T.viz && el.classList.contains("on") && !el.classList.contains("out")) {
        T.viz.resize(); T.viz.start(); T.viz.setMode(T.V.readVizPref()); T.viz.push({ stationActivity: 0.3, beat: 1 });
      }
    }).catch(() => {});
  },
  progress(pct, msg) {
    const v = Math.max(0, Math.min(100, pct));
    $("#ldbar").style.height = v + "%"; $("#ldpbar").style.width = Math.max(2, v) + "%"; $("#ldpct").textContent = Math.round(v) + "%";
    this.three?.viz?.push({ stationActivity: 0.25 + pct / 140, loadProgress: pct / 100, ...(msg && msg !== this.lastMsg ? { beat: 1 } : {}) }); this.lastMsg = msg;
    if (msg && $("#ldcon").firstChild?.textContent !== msg) $("#ldcon").innerHTML = `<div>${esc(msg)}</div>`;
  },
  fail(msg) { $("#ldcon").innerHTML = `<div class="err">${esc(msg)}</div>`; $("#ldback").style.display = "block"; },
  report(r) {                                                 // the launch failure ticket the server filed for it
    const said = launchReportText(r), line = $("#ldcon .err"); if (!said || !line || line.querySelector(".lfr")) return;
    line.insertAdjacentHTML("afterbegin", `<b class="lfr" title="${esc(r.label || "")}">${esc(said)}</b> · `);   // first: the line ellipsizes
  },
  hide() { const generation = this.generation, el = $("#loader"); el.classList.add("out"); setTimeout(() => {
    if (generation !== this.generation) return;
    el.classList.remove("on", "out"); this.three?.viz?.stop(); this.mods?.clear();
  }, 600); },
};

(() => {

    if (cur && !devs.some(d => d.deviceId === cur)) note("The selected microphone is unavailable. Choose another input or System default.");
    if (failure) note(failure);

      const d = document.createElement("button"); d.type = "button"; d.className = "micmenu-item";
      d.setAttribute("role", "menuitem"); d.textContent = "Allow microphone access to list device names";

        } catch (error) { if (menu === m) { note("Microphone access failed: " + error.message); d.disabled = false; } }
        finally { stream?.getTracks().forEach(t => t.stop()); }

    y = Math.max(8, Math.min(y, innerHeight - h - 8));

    const g = game?.getBoundingClientRect() || (native ? { left:native.x, top:native.y, right:native.x+native.w, bottom:native.y+native.h } : null);
    // Prefer available sidebar space to keep every choice clickable while the
    // embedded native window updates its popup cutouts. Keep the usual anchor
    // placement when it already clears the game.
    if (g && g.right > g.left && g.bottom > g.top && x < g.right && x+w > g.left && y < g.bottom && y+h > g.top) {
      if (g.right+8+w <= innerWidth-8) x = g.right+8;
      else if (g.left-w-8 >= 8) x = g.left-w-8;
      else if (g.top-h-8 >= 8) y = g.top-h-8;

      if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)) return;
      e.preventDefault(); const items = [...m.querySelectorAll("button:not(:disabled)")], i = items.indexOf(document.activeElement);
      const next = e.key === "Home" ? 0 : e.key === "End" ? items.length - 1 : (i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      items[next]?.focus();
    };
  };
  document.addEventListener("pointerdown", e => { if (!menu || !menu.contains(e.target)) close(); }, true);
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); }, true);
  navigator.mediaDevices?.addEventListener?.("devicechange", close);
  window.addEventListener("resize", close);
})();

function romxShow(card, r) {
  let box = card.querySelector(".romx");
  if (!box) { box = document.createElement("div"); box.className = "romx"; box.style.cssText = "display:flex;flex-direction:column;gap:3px;font-size:11px"; card.querySelector(".row").after(box); }

  const mb = n => n >= 2 ** 20 ? (n / 2 ** 20).toFixed(n >= 2 ** 30 ? 0 : 1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  const size = Object.fromEntries((r.files || []).map(f => [f.path, f.size]));
  const a = (path, label, tip) => `<a class="b" href="${u(path)}" download="${esc(path.split("/").pop())}" title="${esc(tip || path)}">${label} · ${mb(size[path] || 0)}</a>`;
  const img = !r.image ? "" : r.image === "game/"

    : a(r.image, "💽 " + esc(r.image.split(".").pop().toUpperCase()) + " image", r.image + ": your game with the mod built in, for your own flash cart / console / emulator");
  const pats = (r.patches || []).filter(x => x.file).map(x => a(x.file, "🩹 " + esc(x.format.toUpperCase()) + " patch",
    `${x.file}: shareable, contains no game data` + (r.source ? ` (apply to ${r.source.vanilla_image}, crc32 ${r.source.crc32 || "?"})` : ""))).join("");
  const chts = (r.cheat_files || []).map(f => a(f, "🎟 " + esc(f), "cheat codes for your emulator")).join("");
  const skip = (r.components || []).filter(c => c.kind === "none");
  box.innerHTML = `<div class="row">${img}${pats}${chts}${a("README.txt", "README")}</div>`
    + (r.warning ? `<span class="warn">${esc(r.warning)}</span>` : "")
    + (skip.length ? `<details><summary class="mut">${skip.length} step${skip.length > 1 ? "s" : ""} stay live gBox mods (not bakeable)</summary>${skip.map(c => `<div class="mut">${esc(c.label)}: ${esc(c.why)}</div>`).join("")}</details>` : "")
    + `<span class="mut">${esc(r.note || "")}</span>`;

  let d0 = null;

// ---------------- Cheats: database codes (toggle live) + your own codes ----------------
async function cheatJob(sid, input) {

}

function gstateRender(st) {

      ${[...enemies, ...near.filter(e => e.kind !== "enemy")].slice(0, 14).map(e => `<tr><td>${esc(e.class || "")}</td><td>${e.kind}</td><td>${e.entity_id.toString(16)}</td><td>${e.room}</td>
        <td>${e.hp !== undefined ? `${e.hp}/${e.hp_max}` : ""}</td><td>${Math.round(Math.hypot(e.x - p.x, e.z - p.z))}</td></tr>`).join("")}</table>

      ${Object.entries(st.evidence || {}).map(([k, v]) => `<div><b>${esc(k)}</b>: <span class="mut">${esc(v)}</span></div>`).join("")}</details>`;

  const col = { enemy: "#ff5252", gate: "#ffd54f", npc: "#80deea", object: "#5f7f5f", player: "#ffffff" };

  g.strokeStyle = "#fff"; g.beginPath(); g.moveTo(cv.width / 2, cv.height / 2); g.lineTo(cv.width / 2 + Math.sin(h) * 18, cv.height / 2 + Math.cos(h) * 18); g.stroke();
}

// ---------------- CPU debugger: registers, disassembly, halt/step/resume, breakpoints, video memory ----------------
const D = { regs: {}, prev: {}, info: null, addr: null, busy: false };
async function cpuRefresh(sid, withRegs) {
  if (D.busy || !$("#cpu")) return; D.busy = true;
  try {
    const inf = await rpc(sid, "debug_info", { regs: withRegs });
    D.info = inf;
    const f = new Set(inf.features), halted = inf.halted;
    $("#cpust").className = "st " + (halted ? "halt" : "run");
    $("#cpust").textContent = `${inf.cpu.toUpperCase()} · ${halted ? "halted" : "running"}${f.has("regs") ? "" : " · memory + disassembly only (this emulator has no debug server)"}`;
    for (const id of ["#dhalt", "#dstep", "#dres", "#dlive"]) $(id).disabled = !f.has("halt");
    $("#dbpadd").disabled = !f.has("break");
    if (inf.regs) { D.prev = D.regs; D.regs = inf.regs; }
    $("#dregs").innerHTML = Object.entries(D.regs).map(([k, v]) => `<span class="${D.prev[k] !== undefined && D.prev[k] !== v ? "chg" : ""}"><b>${esc(k)}</b>${hex(v >>> 0)}</span>`).join("");
    const bps = inf.breakpoints || [];
    $("#dbps").innerHTML = bps.length ? "Breakpoints: " + bps.map(b => `<a href="#" data-rb="${b.address}" data-k="${b.kind}">${b.kind} 0x${hex(b.address)} ✕</a>`).join(" · ") : "";
    if ($("#dvram").options.length === 1) (inf.vram || []).forEach((v, i) => $("#dvram").add(new Option(`${v.label}${v.address == null ? " (address from video registers: n/a)" : ""}`, i)));
    const pc = D.regs.pc, at = $("#dfollow").checked && pc !== undefined ? pc : D.addr;
    if (at === null || at === undefined) { $("#ddis").textContent = "Enter an address to disassemble."; return; }
    const lines = await rpc(sid, "debug_disasm", { address: Math.max(0, at - 32), count: 40 });
    const bpset = new Set(bps.filter(b => b.kind === "exec").map(b => b.address));
    $("#ddis").innerHTML = lines.map(l => `<span class="l ${l.addr === pc ? "pc" : ""} ${bpset.has(l.addr) ? "bp" : ""}" data-a="${l.addr}">${hex(l.addr)}  ${l.bytes.padEnd(8)}  ${esc(l.mnemonic.padEnd(8))} ${esc(l.operands)}</span>`).join("");
    const cur = $("#ddis .pc"); if (cur && $("#dfollow").checked) cur.scrollIntoView({ block: "center" });
  } catch (e) { $("#dmsg").textContent = e.message; }
  finally { D.busy = false; }
}
function cpuInit(sid) {
  const rl = $("#dbgrelaunch");
  if (rl) rl.onclick = async () => {                        // launch the debugger copy first; this one closes once it runs
    const s = (await api("/api/sessions")).find(x => x.session_id === sid);
    if (!s?.game_id) return;
    const mod = (s.collection_mod || s.mod || "").split("~")[0], label = rl.textContent;
    rl.disabled = true; rl.textContent = "Starting the debugger copy on the Spark (this game keeps running until it is up)…";
    try {
      let j = await api(`/api/games/${s.game_id}/launch?node=linux&debug=true${mod ? "&mod=" + encodeURIComponent(mod) : ""}`, {});
      while (/queued|running/.test(j.state)) { await new Promise(r => setTimeout(r, 700)); j = await api("/api/jobs/" + j.id); if (j.progress?.msg) rl.textContent = j.progress.msg + "…"; }
      if (j.state !== "succeeded" || !j.output?.session_id) throw new Error(j.error || j.state);

    const a = e.target.closest("span.l")?.dataset.a; if (a === undefined) return;

  $("#dbps").onclick = e => { const a = e.target.dataset?.rb; if (a === undefined) return; e.preventDefault(); act("debug_unbreak", { address: +a, kind: e.target.dataset.k }); };
  $("#dvram").onchange = e => {
    const v = D.info?.vram?.[+e.target.value]; if (!v || v.address == null) return;
    I.src = "ram"; I.addr = v.address; $("#msrc").value = "ram"; $("#maddr").value = hex(v.address); hexRefresh(sid);
    if (v.view.startsWith("tiles:")) { I.tsrc = "ram"; I.toff = v.address; I.fmt = v.view.slice(6); $("#tsrc").value = "ram"; $("#tfmt").value = I.fmt; $("#toff").value = hex(v.address); I.fb = null; tilesRender(sid); }
    if (v.view.startsWith("fb:")) { const [, fmt, w] = v.view.split(":"); fbRender(sid, v.address, fmt, +w, v.size); }
  };
  cpuRefresh(sid, true);
  const t = setInterval(() => { if (!$("#cpu")) return clearInterval(t); cpuRefresh(sid, $("#dlive").checked || D.info?.halted); }, 1000);
}
async function fbRender(sid, addr, fmt, w, size) {             // linear framebuffer in video memory -> tile canvas
  const msg = $("#tmsg");
  try {
    const bpp = fmt === "rgba8888" ? 4 : 2, h = Math.min(512, Math.floor(size / (w * bpp)));
    const b = await readRange(sid, "ram", addr, w * h * bpp), cv = $("#tiles");
    cv.width = w; cv.height = h; cv.style.width = w * Math.min(I.zoom, 2) + "px"; cv.style.height = h * Math.min(I.zoom, 2) + "px";
    const ctx = cv.getContext("2d"), img = ctx.createImageData(w, h);
    for (let i = 0; i < w * h; i++) {
      let r, g, bl, o = i * bpp;
      if (bpp === 4) { r = b[o]; g = b[o + 1]; bl = b[o + 2]; }
      else { const v = b[o] | (b[o + 1] << 8);
        if (fmt === "rgb565") { r = (v >> 11) << 3; g = ((v >> 5) & 63) << 2; bl = (v & 31) << 3; }
        else if (fmt === "rgba5551") { const u = (b[o] << 8) | b[o + 1]; r = (u >> 11) << 3; g = ((u >> 6) & 31) << 3; bl = ((u >> 1) & 31) << 3; }
        else { r = (v & 31) << 3; g = ((v >> 5) & 31) << 3; bl = ((v >> 10) & 31) << 3; } }   // bgr555
      img.data.set([r, g, bl, 255], i * 4);
    }
    ctx.putImageData(img, 0, 0);
    if (msg) msg.textContent = `framebuffer ${w}×${h} ${fmt} @ 0x${hex(addr)}`;
  } catch (e) { if (msg) msg.textContent = e.message; }
}

async function re6GiveNow() {

    const j = await runJob({ tool: "re6", input: { session_id: RE6.sid, op: "give_now", item: String(id), amount }, require_worker: RE6.sid.split("-")[0] }).catch(e => ({ state: "failed", error: e.message }));

  assets: q => window.assetSidebar?.reveal?.(q),
  chatModel: () => ({ name: "" }),                         // the Spark's local default (the desktop passes its header model)
  session: sid => ({ game: active?.title || "", game_id: document.querySelector("#wb[data-gid]")?.dataset.gid || "", worker: String(sid || "").split("-")[0] }),
  view: () => typeof cur === "string" ? (cur === "Sessions" ? `web Sessions · ${sessionMode || "play"}` : "web " + cur) : "web",
  sessionOp: async (sid, op) => { const j = await runJob({ tool: "session_op", input: { session_id: sid, op }, require_worker: sid.split("-")[0] });
    if (j.state !== "succeeded") throw new Error(j.error || j.state); return j.output?.result; },
  fallbackLive: async o => { const sid = active?.sid; const j = await runJob({ tool: "characters", input: { op: "live_use", character: o.character, session_id: sid, x: o.x, y: o.y,
    ...(o.aspect ? { window_aspect: +(+o.aspect).toFixed(4) } : {}), ...((o.kind === "player" || o.target) ? { target: o.kind === "player" ? "player" : o.target } : {}) }, require_worker: sid.split("-")[0] });
    if (j.state !== "succeeded") throw new Error(j.error || j.state); return j.output?.result || {}; },
  fallbackBuild: o => api("/api/requests/auto-mod-failure", { session_id: active?.sid || "", game: active?.title || "", model: o.name, character: o.character,
    action: "pick whip model replacement", target: o.target || "", target_kind: o.kind || "", x: o.x, y: o.y, moment: `x=${o.x}, y=${o.y}`,
    needs_rebuild: true, replacement_requested: true, detail: (o.steps || []).map(s => `${s.via} ${s.mode}: ${s.error || s.status}`).join("; ") || "no live path" }).catch(() => null),
});
// Right-click any emulator view (the Sessions stream, Inspect's picture, Examine's live frame): the character menu,
// Report… first. It opens even when nothing is identified there.
const PW_GAME_VIEW = "#scr, #nativeslot, .gbox-gpu-video, img.screen, img[src*='/mjpeg']";
document.addEventListener("contextmenu", e => {
  if (e.defaultPrevented) return;
  const v = e.target.closest?.(PW_GAME_VIEW); if (!v || v.id === "pipimg") return;
  e.preventDefault(); e.stopPropagation();
  if (v.id === "nativeslot" || v.classList.contains("gbox-gpu-video")) {
    console.log("GBOX:" + JSON.stringify({ ev: "gamecontext", x: e.clientX, y: e.clientY }));
  } else PWW.menuAt(e.clientX, e.clientY, v);
});
</script>
