<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>gBox overlay swap</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
html{color-scheme:dark} /* Match the embedded host so Chromium preserves transparency. */
canvas{display:block;transition:opacity .4s}
#banner{position:fixed;left:50%;top:14px;transform:translateX(-50%);padding:7px 14px;border-radius:8px;font:600 14px system-ui,sans-serif;
  color:#fff;background:rgba(20,20,26,.82);box-shadow:0 2px 10px rgba(0,0,0,.5);display:none;white-space:nowrap}
</style></head>
<body><canvas id="cv"></canvas><div id="banner"></div>
<script type="module">
// Overlay swap: a collection model drawn over the operator's on-screen character (the desktop app's click-through window
// above the docked game; clients/desktop/overlay.js feeds it the tracked box ~30x/s). Orthographic camera in window pixels:
// the model is scaled to the box height (a bit larger, to cover the original), feet on the box bottom, faces where it moves,
// with a procedural idle bob / walk sway / hop. Test without the app: ?slug=mario&token=..&box=x,y,w,h[&move=1&facing=..&bg=img]
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/+esm";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js/+esm";

const q = new URLSearchParams(location.search);
if (parent !== window && !window.gboxOverlay) {
  window.gboxOverlay = {
    on: fn => addEventListener("message", e => {
      if (e.source === parent && e.data?.gboxSwap) fn(e.data.gboxSwap);
    }),
    status: s => parent.postMessage({ gboxSwapStatus: s }, "*")
  };
}
const cv = document.getElementById("cv"), banner = document.getElementById("banner");
const R = new THREE.WebGLRenderer({ canvas: cv, alpha: true, antialias: true });
R.setClearColor(0x000000, 0);
R.outputColorSpace = THREE.SRGBColorSpace;
R.setPixelRatio(Math.min(2, devicePixelRatio || 1));
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(0, 1, 0, -1, -1e5, 1e5);      // x right, y up = -screen y, in CSS pixels
scene.add(new THREE.HemisphereLight(0xffffff, 0x50505a, 1.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(0.5, 1, 1.4); scene.add(sun);
const size = () => { R.setSize(innerWidth, innerHeight); cam.right = innerWidth; cam.bottom = -innerHeight; cam.updateProjectionMatrix(); };
addEventListener("resize", size); size();

const S = { api: q.get("api") || location.origin, token: q.get("token") || "", slug: "", H: 1, W: 1, tgt: null, ok: true,
            set: { scale: 1, dx: 0, dy: 0, backdrop: false, facing: "auto" }, bg: [60, 60, 60], loaded: false };
const holder = new THREE.Group(), yawG = new THREE.Group();          // holder: feet point, lean, squash; yawG: facing
holder.add(yawG); scene.add(holder);
// soft backdrop: a feathered ellipse in the colour around the box, behind the model (hides more of the original)
const gc = Object.assign(document.createElement("canvas"), { width: 128, height: 128 }), gx = gc.getContext("2d");
const grd = gx.createRadialGradient(64, 64, 10, 64, 64, 64); grd.addColorStop(0, "#fff"); grd.addColorStop(0.68, "#fff"); grd.addColorStop(1, "rgba(255,255,255,0)");
gx.fillStyle = grd; gx.fillRect(0, 0, 128, 128);
const back = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(gc), transparent: true, depthTest: false, depthWrite: false }));
const backScene = new THREE.Scene(); back.visible = false; backScene.add(back);   // its own pass, before the model
R.autoClear = false;
let mixer = null, clips = {}, cur = null;

async function loadModel(slug) {
  S.slug = slug; S.loaded = false;
  const mgr = new THREE.LoadingManager();
  mgr.setURLModifier(u => u.startsWith(S.api) && !/[?&]token=/.test(u) ? u + (u.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(S.token) : u);
  const L = new GLTFLoader(mgr);
  L.setResourcePath(`${S.api}/api/characters/${encodeURIComponent(slug)}/file/`);   // a .gltf's .bin / textures
  const g = await L.loadAsync(`${S.api}/api/characters/${encodeURIComponent(slug)}/model`);
  const root = g.scene;
  root.traverse(o => { if (o.isMesh) { o.frustumCulled = false;
    for (const m of [].concat(o.material)) { m.side = THREE.DoubleSide; if (m.map && m.transparent) m.alphaTest = Math.max(m.alphaTest || 0, 0.3); } } });
  root.updateMatrixWorld(true);
  let b = new THREE.Box3().setFromObject(root, true), sz = b.getSize(new THREE.Vector3());
  if (sz.z > sz.y * 1.25 && sz.z >= sz.x) {                       // Z-up export: stand it up
    root.rotation.x -= Math.PI / 2; root.updateMatrixWorld(true);
    b = new THREE.Box3().setFromObject(root, true); sz = b.getSize(new THREE.Vector3());
  }
  const c = b.getCenter(new THREE.Vector3());
  root.position.x -= c.x; root.position.z -= c.z; root.position.y -= b.min.y;      // feet at the origin, centred
  yawG.clear(); yawG.add(root);
  S.H = Math.max(1e-6, sz.y); S.W = Math.max(1e-6, sz.x, sz.z);
  mixer = null; clips = {}; cur = null;
  if (g.animations?.length) {                                     // real clips if the entry has them; procedural otherwise
    mixer = new THREE.AnimationMixer(root);
    for (const a of g.animations) {
      if (!clips.idle && /idle|wait|stand/i.test(a.name)) clips.idle = mixer.clipAction(a);
      if (!clips.walk && /walk|run/i.test(a.name)) clips.walk = mixer.clipAction(a);
    }
  }
  S.loaded = true; document.title = "loaded " + slug;
}

// ---- per-frame motion: smoothed box, velocity, facing, procedural animation ----
const M = { sm: null, vx: 0, vtop: 0, spd: 0, walk: 0, dir: 1, yaw: 0, phase: 0, hop: 9, lost: 0, last: performance.now(), t0: performance.now() };
const YAW = { side: d => d * 1.15, front: (d, a) => d * 0.75 * a, behind: (d, a) => Math.PI - d * 0.75 * a };
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - M.last) / 1000); M.last = now;
  const t = (now - M.t0) / 1000, Wd = innerWidth, Hd = innerHeight;
  if (!S.tgt || !S.loaded) { R.clear(); return; }
  const b = { x: S.tgt[0] * Wd, y: S.tgt[1] * Hd, w: S.tgt[2] * Wd, h: S.tgt[3] * Hd };
  const cx = b.x + b.w / 2, bot = b.y + b.h;
  if (!M.sm) { M.sm = { cx, bot, top: b.y, w: b.w, h: b.h }; M.dir = cx < Wd / 2 ? 1 : -1; M.yaw = (YAW[S.set.facing] || YAW.side)(M.dir, 0); }
  const s = M.sm, kp = 1 - Math.exp(-dt * 22), kh = 1 - Math.exp(-dt * 4), pcx = s.cx, ptop = s.top;
  s.cx += (cx - s.cx) * kp; s.bot += (bot - s.bot) * kp; s.top += (b.y - s.top) * kp;
  s.h += (b.h - s.h) * kh; s.w += (b.w - s.w) * kh;                 // the size is noisy: follow it slowly
  const hh = Math.max(16, s.h);
  M.vx += ((s.cx - pcx) / Math.max(dt, 1e-3) / hh - M.vx) * (1 - Math.exp(-dt * 6));     // box heights per second
  M.vtop += ((s.top - ptop) / Math.max(dt, 1e-3) / hh - M.vtop) * (1 - Math.exp(-dt * 10));
  M.spd += (Math.abs(M.vx) - M.spd) * (1 - Math.exp(-dt * 5));
  if (M.vx > 0.35) M.dir = 1; else if (M.vx < -0.35) M.dir = -1;  // face the way it moves (with some hysteresis)
  const moving = M.spd > 0.25;
  M.walk += ((moving ? 1 : 0) - M.walk) * (1 - Math.exp(-dt * 6));
  M.phase += dt * (moving ? 5 + 5 * Math.min(M.spd, 1.5) : 1.5);
  if (M.vtop < -1.6 && M.hop > 0.5) M.hop = 0;                    // the box shot up: a little hop
  M.hop += dt;
  const mode = S.set.facing === "auto" ? "side" : S.set.facing, a = Math.min(1, M.spd / 0.8);
  const ty = (YAW[mode] || YAW.side)(M.dir, a);
  M.yaw += (ty - M.yaw) * (1 - Math.exp(-dt * 9));
  // animation: idle breathe/bob, walk bob + sway + lean into the motion, hop arc with a stretch
  const br = Math.sin(t * 2.4), w = M.walk;
  const hopA = M.hop < 0.4 ? Math.sin(Math.PI * M.hop / 0.4) : 0;
  const bob = (1 - w) * 0.012 * (br + 1) + w * 0.035 * Math.abs(Math.sin(M.phase)) + 0.12 * hopA;
  const k = hh * 1.12 * (S.set.scale || 1) / S.H;                 // a bit taller than the box: covers the original
  const widen = Math.min(1.3, Math.max(1, s.w * 1.05 / (S.W * k)));
  const st = 1 + (1 - w) * 0.012 * br + 0.06 * hopA;
  holder.scale.set(k * widen * (1 - (1 - w) * 0.006 * br), k * st, k * widen);
  holder.position.set(s.cx + S.set.dx * s.w, -(s.bot + S.set.dy * s.h) + bob * hh, 0);
  holder.rotation.z = w * 0.07 * Math.sin(M.phase) - M.dir * w * 0.1 * a;
  yawG.rotation.y = M.yaw;
  if (mixer) {
    const want = (moving && clips.walk) || clips.idle || clips.walk;
    if (want && want !== cur) { cur?.fadeOut(0.25); want.reset().fadeIn(0.25).play(); cur = want; }
    mixer.update(dt * (moving ? 0.6 + 0.5 * M.spd : 1));
  }
  back.visible = !!S.set.backdrop;
  if (back.visible) {
    back.position.set(s.cx + S.set.dx * s.w, -(s.bot - s.h / 2 + S.set.dy * s.h), 0);
    back.scale.set(Math.max(s.w * 1.5, hh * 0.6), hh * 1.3, 1);
    back.material.color.setRGB(S.bg[0] / 255, S.bg[1] / 255, S.bg[2] / 255, THREE.SRGBColorSpace);
  }
  M.lost = S.ok ? 0 : M.lost + dt;                                  // lost: hold where it was last seen, fade a little
  const op = M.lost > 1 ? "0.45" : "1"; if (cv.style.opacity !== op) cv.style.opacity = op;
  R.clear();
  if (back.visible) { R.render(backScene, cam); R.clearDepth(); }
  R.render(scene, cam);
}
requestAnimationFrame(frame);

function handle(m) {
  if (m.type === "model") { if (m.api) S.api = m.api; if (m.token) S.token = m.token;
    loadModel(m.slug).then(() => window.gboxOverlay?.status({ loaded: m.slug }), e => window.gboxOverlay?.status({ error: String(e.message || e) })); }
  else if (m.type === "box") { S.tgt = m.box; S.ok = m.ok !== false; if (m.bg) S.bg = m.bg; }
  else if (m.type === "set") { Object.assign(S.set, m.set || {}); }
  else if (m.type === "reset") { S.tgt = null; M.sm = null; }
  else if (m.type === "banner") { banner.textContent = m.text || ""; banner.style.display = m.text ? "block" : "none"; }
  else if (m.type === "show") { cv.style.display = m.on ? "block" : "none"; }
}
if (window.gboxOverlay) { window.gboxOverlay.on(handle); window.gboxOverlay.status({ ready: true }); }
else if (q.get("slug")) {                                         // standalone test (headless screenshots)
  if (q.get("bg")) Object.assign(document.body.style, { background: `#000 url(${q.get("bg")}) center/100% 100% no-repeat` });
  for (const k of ["scale", "dx", "dy"]) if (q.get(k)) S.set[k] = +q.get(k);
  if (q.get("facing")) S.set.facing = q.get("facing");
  if (q.get("backdrop")) { S.set.backdrop = true; S.bg = q.get("backdrop").split(",").map(Number); }
  if (q.get("banner")) handle({ type: "banner", text: q.get("banner") });
  const bx = (q.get("box") || "0.4,0.4,0.15,0.4").split(",").map(Number);
  S.tgt = bx;
  if (q.get("move")) { const d = +q.get("move"), x0 = bx[0], t0 = performance.now();      // walk back and forth (d = direction first)
    setInterval(() => { const t = (performance.now() - t0) / 1000; S.tgt = [x0 + d * 0.12 * (1 - Math.cos(t * 1.2)), bx[1], bx[2], bx[3]]; }, 33); }
  const say = t => { if (!q.get("banner")) { banner.textContent = t; banner.style.display = t ? "block" : "none"; } };
  say("loading " + q.get("slug") + "…" + (R.getContext() ? "" : " (no WebGL)"));
  loadModel(q.get("slug")).then(() => say(q.get("status") ? "loaded " + q.get("slug") : ""), e => say("load failed: " + (e.message || e)));
}
</script></body></html>
