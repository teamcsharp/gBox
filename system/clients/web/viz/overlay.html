<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>gBox voice overlay</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="cv"></canvas>
<script type="module">
// Voice overlay: the desktop app floats this click-through window over the game while you talk to gBox or it talks back.
import { createViz, readVizPref } from "./viz.js";
const q = new URLSearchParams(location.search), want = q.get("mode");
const pref = () => want && want !== "random" ? want : readVizPref();      // the picker's choice; "random" = a different visual each time
const viz = await createViz(document.getElementById("cv"), { mode: pref(), quality: "auto" });
addEventListener("resize", () => viz.resize());
// a new conversation (#250) asks for a fresh visual: a randomized transition into another mode (or the fixed one the picker chose)
window.gboxVoiceMode = m => viz.setMode(m && m !== "random" ? m : pref(), { transition: Math.random() < 0.5 ? "crossfade" : "dissolve" });
// the app pushes who's talking + loudness so the visual pulses with the conversation
window.gboxVoice = s => { if (s.mode) window.gboxVoiceMode(s.mode); viz.push({ stationActivity: 0.3 + (s.level || 0) * 0.7, ...(s.beat ? { beat: 1 } : {}) }); };
addEventListener("message", e => { if (e.source === parent && e.data?.gboxVoice) window.gboxVoice(e.data.gboxVoice); });
</script></body></html>
