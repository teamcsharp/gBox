# gBox deployment: control plane + worker on the DGX Spark (lilspark, 10.89.1.246), Windows node as extra worker.
# One file for both nodes: every path is given per-OS; data_dir resolves next to this file
# (Spark: /home/ehm_eckx/gBox/gbox-data, Windows: \\10.89.1.246\ehm_eckx\gBox\gbox-data).
data_dir = "gbox-data"
api_host = "0.0.0.0"              # LAN only; every API call needs the token in gbox-data/api_token
api_port = 8765
public_url = "http://10.89.1.246:8765"
cache_limit_gb = 200
sync_mod_builds_on_startup = false # do not send local game builds to the control plane automatically
preferred_launch_workers = { ps4 = "i9-NUC" } # automatic PS4 Play stays on this PC; choose another node explicitly to override
stage_min_mb = 32                 # disc images above this are copied to the node's local cache before launch
cache_dirs = { linux = "/home/ehm_eckx/gBox_alt/gbox-cache", windows = "D:/gBox/cache" }   # fast local disk per node (LRU, bounded; originals never modified); the Spark: the NVMe hot tier
cache_limits_gb = { linux = 150, windows = 250 }   # ceiling for staged library copies on that disk (LRU eviction; never mods, bases, libraries or cold data)
# Two-tier cache (docs/cache-tiers.md): the Spark keeps at most hot_cache_limit_gb on the NVMe (character library and
# indexes pinned there); least recently used games move to the Elements HDD only while the Spark is idle, leaving a
# symlink, and move back when used. Nodes without a cold_cache_dirs entry (the Windows PCs) keep a single tier.
cold_cache_dirs = { linux = "/home/ehm_eckx/samples/gbox-cache" }
hot_cache_limit_gb = { linux = 100 }
cache_tier_idle_minutes = 30         # no session, job or launch on the node for this long before anything is demoted
runtime_dirs = { windows = "D:/gBox/runtime" }   # emulators/cores on the local SSD, not the share

smb_credentials = "/etc/exbox.cred"   # existing NAS credentials file on the Spark (not stored here)
# memory_write: the operator asked for in-game edits from the inspector (every write is audited with rollback bytes)
granted_permissions = ["read", "execute", "stage", "network", "install", "memory_write"]
blender_search = ["C:/Users/maste/Desktop/Blender Builds/Builds"]
ghidra_home = "/home/ehm_eckx/reverse/ghidra_12.1.4_PUBLIC"   # the operator's own Ghidra on the Spark (JDK 21 pinned per run)

# Switch on the Spark (Linux aarch64) runs in Eden (docs/research/switch-emulator-spark.md); per node, in
# gbox.local-lilspark.toml, because [emulators.switch].executable is the Windows nodes' portable Yuzu:
# switch_appimage = "/home/ehm_eckx/gBox_alt/switch/Eden-Linux-v0.2.1-aarch64-gcc-standard.AppImage"   # extracted once
# switch_keys = "/mnt/gbox/quickswap2/Emulation/_switch/prod.keys"   # default: a prod.keys at the Switch library's root

# PS4 setup belongs in each node's gbox.local-<hostname>.toml; point at the standalone shadPS4 core.
# [emulators.ps4]
# adapter = "shadps4"
# executable = "D:/Emulators/shadPS4/shadPS4.exe"
# stage_local = false             # preserve the complete extracted game folder, not only eboot.bin

