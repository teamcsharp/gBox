# Recipe: gBox Qwen3-Coder-Next-FP8 on one DGX Spark, KV cache maxed
#
# Shipped in the gBox repo (system/hermes/spark2-recipes). The Tasks providers
# model trials install it into ~/spark-vllm-docker/recipes on lilspark2 before
# every prepare and start, so edit it in the repo, not on the Spark.
# It is the upstream qwen3-coder-next-fp8 recipe with the single-Spark numbers
# that fill the GB10 instead of leaving half of it idle.
#
# Measured on lilspark2 (vLLM 0.32.0rc1 in the vllm-node image, 121.7 GiB):
#   Model loading took 75.46 GiB. At gpu-memory-utilization 0.80 the KV pool
#   was 13.28 GiB (998k FP8 tokens) and the scheduler reserved nothing beyond
#   it; Hermes used 29-52 % of that pool with 12-23 requests running while new
#   requests still waited on prefill. The 64k context cap came from gBox, not
#   from the model.
#
# gpu_memory_utilization 0.88: a 107.1 GiB budget. Weights plus non-torch
#   memory take 80.9 GiB and peak activation about 3.2 GiB, which leaves about
#   20 GiB of KV cache (about 1.5M tokens, 5.7 full-length requests). About
#   14.6 GiB stays for the OS, docker and downloads; 0.90 is the next step once
#   nothing else runs on the box.
# max_model_len 262144: max_position_embeddings in the checkpoint's
#   config.json; no rope scaling is needed. gBox passes it on the command line
#   and records the same number as the Hermes route's context.
# max_num_seqs 64: every Hermes job on the node (capacity 12-32) decodes in one
#   batch. vLLM's default on this tier is 256, which only lengthens CUDA graph
#   capture; 64 covers twice the largest capacity setting.
# max_num_batched_tokens 8192: tokens prefilled per scheduler step (vLLM's
#   GB10 default is 2048). With 3B active parameters prefill runs 4-5k tok/s,
#   so a 30k prompt takes 4 steps instead of 15 and holds the decode batch for
#   less time. Chunked prefill is on by default and keeps decode interleaved.
# kv-cache-dtype fp8: halves KV bytes per token. The checkpoint carries no
#   k/v scales (vLLM logs scale 1.0), the same as the upstream recipe.
# enable-prefix-caching: Hermes resends shared system prompts and tool lists;
#   the live log showed a 42 % prefix hit rate.
# CUDA graphs: vLLM's default FULL_AND_PIECEWISE mode, nothing to add.
# tool-call-parser qwen3_coder: Qwen3-Coder's XML function format; the gBox
#   probe (native tool call, tool response, plain reply) passes with it.
# No reasoning parser: this checkpoint does not emit <think> blocks.
# load-format instanttensor and attention-backend flashinfer: as upstream, the
#   fast load path and the attention kernels tuned for sm121 in this image.
#
# Manual launch (what gBox runs, minus the container name it chooses):
#   cd ~/spark-vllm-docker && python3 run-recipe.py gbox-qwen3-coder-next-fp8 \
#     --solo --tp 1 --port 8000 --max-model-len 262144 \
#     --gpu-memory-utilization 0.88 --name gbox-trial-<id> -j 2 --daemon --earlyoom

recipe_version: "1"
name: gBox-Qwen3-Coder-Next-FP8-Solo-Max
description: vLLM serving Qwen/Qwen3-Coder-Next-FP8 on one DGX Spark with 256k context and the KV cache filled

model: Qwen/Qwen3-Coder-Next-FP8
container: vllm-node
solo_only: true

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.88
  max_model_len: 262144
  max_num_seqs: 64
  max_num_batched_tokens: 8192

env: {}

command: |
  vllm serve Qwen/Qwen3-Coder-Next-FP8 \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype fp8 \
    --load-format instanttensor \
    --attention-backend flashinfer \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder
