# Recipe: gBox Laguna S 2.1 NVFP4 (RedHatAI) on one DGX Spark
#
# Shipped in the gBox repo (system/hermes/spark2-recipes); the model trials
# install it into ~/spark-vllm-docker/recipes on lilspark2. Edit it in the repo.
#
# The checkpoint is RedHatAI/Laguna-S-2.1-NVFP4 (poolside Laguna S 2.1: 48
# layers, 12 with global attention and 36 with 512-token sliding-window
# attention, per-head output gating; 256 experts plus one shared, 10 active,
# 117.6B total and 8.5B active parameters; compressed-tensors NVFP4 W4A4 on the
# routed experts of layers 1-39; the attention projections, shared experts and
# the experts of layers 40-47 stay BF16). vLLM has the architecture built in
# (LagunaForCausalLM, no remote code). It sits in ~/models/laguna-s-2.1-nvfp4
# (49 shards, 99.7 GB, sizes verified against the Hub); gBox mounts the folder
# read-only at /models/laguna-s-2.1-nvfp4 and --served-model-name keeps the
# Hub id as the model id Hermes asks for.
#
# Memory is the whole story for this one. The weights alone are 92.9 GiB, 22 GiB
# more than poolside's own fully quantized Laguna-S-2.1-NVFP4 (71 GB), because
# RedHatAI keeps eight expert layers in BF16. On a 121.7 GiB GB10 that leaves
# little for the KV cache, so these settings maximise it:
#
# gpu_memory_utilization 0.90: 109.5 GiB budget; weights plus non-torch memory
#   about 98 GiB and activation at 4096 batched tokens about 3.5 GiB leave an
#   expected 7-8 GiB of KV cache. The OS keeps about 12 GiB; this is the
#   highest the box tolerates with vLLM's host-side processes. Do not run
#   downloads or other models beside it.
# kv-cache-dtype fp8: the checkpoint's own KV scheme. With FP8 only the 12
#   global layers hold the full sequence (24.6 KB per token); the sliding
#   layers keep 512 tokens per request. 7-8 GiB is about 300k tokens: 1.2 full
#   262k requests, or about ten typical 30k Hermes calls at once.
# max_model_len 262144: the setting poolside serves on a Spark (the weights
#   are a native 1M checkpoint; 262144 needs 6.3 GiB of KV for one request).
#   If startup reports a KV cache too small for one request, lower this to
#   131072 or free memory; the RedHatAI checkpoint cannot get smaller.
# max_num_seqs 16: more sequences than the KV pool can hold just wait; 16
#   bounds CUDA graph capture (max-cudagraph-capture-size 16) and memory.
# max_num_batched_tokens 4096: 8.5B active parameters prefill at 600-800
#   tok/s on a GB10 (poolside's figure), so a 4096 chunk is about 6 s per
#   step; larger chunks starve decode, smaller ones cost activation memory
#   for nothing.
# No speculative decoding: poolside's DFlash draft (Laguna-S-2.1-DFlash-NVFP4)
#   lifts single-stream decode from 13-15 to 22-24 tok/s, but it is not on
#   lilspark2, needs its own memory, and batching gives the same aggregate
#   gain for Hermes. Add it when memory allows:
#   --speculative-config '{"model":"poolside/Laguna-S-2.1-DFlash-NVFP4","num_speculative_tokens":7,"method":"dflash"}'
#   (DFlash requires --max-num-seqs 32 or less.)
# Sampling: from the checkpoint's generation_config.json (top_k 20), as the
#   model card asks; no overrides. Do not add min_p.
# No attention or MoE backend flags: the model card relies on vLLM's selection
#   (FlashInfer CUTLASS NVFP4 MoE on sm121); the sliding window needs the
#   per-layer handling the built-in model does itself.
# tool-call-parser poolside_v1, reasoning-parser poolside_v1: the parsers the
#   checkpoint's generation_config names (GLM-style <tool_call> XML with
#   arg_key/arg_value and <think> blocks). The gBox sparkDeux route sends
#   enable_thinking=false on every call; the chat template honours it.
# enable-prefix-caching, enable-chunked-prefill: throughput defaults; CUDA
#   graphs at vLLM's default mode with capture bounded by max_num_seqs.
# load-format instanttensor: the fast single-Spark loader this repo uses for
#   large checkpoints (Qwen3-Coder-Next, Nemotron); 93 GiB from NVMe takes a
#   few minutes either way. First start also JIT-compiles the FP4 kernels.
#
# Manual launch (what gBox runs):
#   cd ~/spark-vllm-docker && python3 run-recipe.py gbox-laguna-s-2.1-nvfp4 \
#     --solo --tp 1 --port 8000 --max-model-len 262144 \
#     --gpu-memory-utilization 0.90 --name gbox-trial-<id> -j 2 --daemon --earlyoom \
#     -v /home/ehm_eckx/models/laguna-s-2.1-nvfp4:/models/laguna-s-2.1-nvfp4:ro
# After the first start, vLLM logs "Replace gpu_memory_utilization config with
# --kv-cache-memory=... to fully utilize gpu memory"; that figure, passed as
# --kv-cache-memory-bytes, is the exact maximum for this box.

recipe_version: "1"
name: gBox-Laguna-S-2.1-NVFP4-Solo
description: vLLM serving RedHatAI/Laguna-S-2.1-NVFP4 from ~/models on one DGX Spark with 256k context

# No "model:" field: the weights are served from the mounted ~/models folder.
container: vllm-node
solo_only: true

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.90
  max_model_len: 262144
  max_num_seqs: 16
  max_num_batched_tokens: 4096

env: {}

command: |
  vllm serve /models/laguna-s-2.1-nvfp4 \
    --served-model-name RedHatAI/Laguna-S-2.1-NVFP4 \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-cudagraph-capture-size {max_num_seqs} \
    --kv-cache-dtype fp8 \
    --load-format instanttensor \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --reasoning-parser poolside_v1 \
    --tool-call-parser poolside_v1 \
    --enable-auto-tool-choice
